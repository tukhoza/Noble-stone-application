spring:
  resources:
    static-locations: classpath:/static/
  mvc:
    view:
      prefix: "classpath:/static/"
      suffix: ".html"
  h2:
    console:
      enabled: true
      path: /h2
  datasource:
    url: jdbc:h2:file:~/test
    username: sa
    password:
    driverClassName: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: true
    hibernate:
        ddl-auto: create
  sql:
    init:
      data-locations: classpath:data-dev.sql
  # batch:
  #   jdbc :
  #     initialize-schema : always

  mail:
    host: localhost
    port: 1025
    username: hello
    password: hello

    properties:
      mail:
        smtp:
          ssl:
            trust: "*"
          auth: true
          connectiontimeout: 5000
          timeout: 3000
          writetimeout: 5000
